[project]
name = "project-autodrive"
version = "0.1.0"
description = "Dual-priced reciprocal-caution branching planner for fixed-path CommonRoad intersection studies."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "casadi>=3.6.7",
    "hydra-core>=1.3.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "shapely>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
commonroad = [
    "commonroad-clcs",
    "commonroad-drivability-checker",
    "commonroad-io",
    "commonroad-route-planner",
    "commonroad-scenario-designer",
]
dev = [
    "pytest>=8.2",
]

[project.scripts]
rcbranch-run-one = "rcbranch.scripts.run_one_scenario:main"
rcbranch-run-benchmark = "rcbranch.scripts.run_benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcbranch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
